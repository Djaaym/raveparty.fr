<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorer les événements — RaveRadar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23FF2D9B'/%3E%3C/svg%3E">
</head>
<body data-page="explore">
<div class="blob b1"></div><div class="blob b2"></div>

<nav class="nav"><div class="wrap nav-inner">
  <a class="brand" href="/"><span class="dot"></span>RAVE<b>RADAR</b></a>
  <div class="nav-links">
    <a href="/explore/" data-i18n="nav.explore">Explorer</a>
    <a href="/map/" data-i18n="nav.map">Carte</a>
    <a href="/organizer/" data-i18n="nav.organizers">Organisateurs</a>
    <a href="/account/" data-i18n="nav.favourites">Favoris</a>
  </div>
  <div class="nav-right">
    <div class="lang-switch"><a href="/" data-lang-link="fr">FR</a><a href="/en/" data-lang-link="en">EN</a></div>
    <a href="/account/" class="btn btn-ghost btn-sm" data-i18n="nav.signin">Connexion</a>
    <a href="/organizer/" class="btn btn-primary btn-sm" data-i18n="nav.add">Ajouter un événement</a>
  </div>
  <button class="nav-toggle" aria-label="Menu">☰</button>
</div></nav>

<section class="section" style="padding-top:48px">
  <div class="wrap">
    <span class="eyebrow" data-i18n="explore.eyebrow">L'annuaire complet</span>
    <h1 class="h-lg" style="margin:14px 0 8px" data-i18n="explore.title">Explore la carte rave de l'Europe</h1>
    <p class="lead" data-i18n="explore.lead">Filtre par pays, genre, type et prix.</p>

    <div class="explore-layout" style="margin-top:40px">
      <aside class="filters">
        <div class="filter-group">
          <h4 data-i18n="explore.search">Recherche</h4>
          <input id="f-search" class="input" type="text" data-i18n-ph="explore.search.ph" placeholder="Artiste, lieu, ville…">
        </div>
        <div class="filter-group">
          <h4 data-i18n="explore.country">Pays</h4>
          <select id="f-country" class="input"></select>
        </div>
        <div class="filter-group">
          <h4 data-i18n="explore.genre">Genre</h4>
          <div id="f-genres"></div>
        </div>
        <div class="filter-group">
          <h4 data-i18n="explore.type">Type</h4>
          <div id="f-types"></div>
        </div>
        <div class="filter-group">
          <h4><span data-i18n="explore.maxprice">Prix max</span> · <span id="price-val">€300+</span></h4>
          <input id="f-price" class="range" type="range" min="0" max="300" value="300" step="5">
        </div>
        <button id="clear-filters" class="btn btn-ghost btn-block btn-sm" style="margin-top:8px" data-i18n="explore.clear">Réinitialiser les filtres</button>
      </aside>

      <div>
        <div class="explore-toolbar">
          <span class="result-count"><b id="result-n">0</b> <span data-i18n="explore.found">événements trouvés</span></span>
          <select id="f-sort" class="input" style="width:auto">
            <option value="date" data-i18n="explore.sort.date">Les plus proches</option>
            <option value="price" data-i18n="explore.sort.price">Prix : croissant</option>
            <option value="price-d" data-i18n="explore.sort.priced">Prix : décroissant</option>
            <option value="az" data-i18n="explore.sort.az">A → Z</option>
          </select>
          <div class="seg">
            <button class="on" data-view="grid" data-i18n="explore.view.grid">▦ Grille</button>
            <button data-view="list" data-i18n="explore.view.list">☰ Liste</button>
          </div>
        </div>
        <div id="explore-results" class="grid grid-3"></div>
      </div>
    </div>
  </div>
</section>

<footer class="footer"><div class="wrap">
  <div class="footer-bottom" style="border:0;margin:0;padding:0">
    <a class="brand" href="/"><span class="dot"></span>RAVE<b>RADAR</b></a>
    <span style="font-family:var(--f-mono)" data-i18n="footer.keep">Reste underground 🔊</span>
  </div>
</div></footer>

<script src="/assets/js/data.js"></script>
<script src="/assets/js/lang.js"></script>
<script src="/assets/js/app.js"></script>
</body>
</html>
